<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping List — familyHub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }

  :root {
    --bg: #FAF7F1;
    --card: #FFFFFF;
    --line: #E7E1D6;
    --ink: #2B2A25;
    --muted: #8A8577;
    --sage: #6B8F71;
    --sage-dark: #4F6F52;
    --clay: #B97452;
    --gold: #E3A23D;
    --bloom: #E1735E;
  }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 1px 2px rgba(43,42,37,0.04);
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    margin: 2px 0 16px;
  }

  /* ── Summary + progress ── */
  .summaryRow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .summaryRow strong { color: var(--ink); font-weight: 600; }

  .clearBtn {
    background: none;
    border: none;
    color: var(--clay);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    padding: 2px 4px;
  }
  .clearBtn:hover { text-decoration: underline; }

  .track {
    height: 6px;
    background: #F0EEE6;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .trackFill {
    height: 100%;
    /* width set from JS: doneCount / totalCount * 100 */
    background: var(--sage);
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  /* ── Add item ── */
  .addRow {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .addRow input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
  }
  .addRow input:focus-visible { outline: 2px solid var(--sage-dark); outline-offset: 1px; }
  .addBtn {
    padding: 10px 16px;
    border-radius: 12px;
    border: none;
    background: var(--gold);
    color: #3A2B12;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .addBtn:hover { filter: brightness(1.05); }
  .addBtn:focus-visible { outline: 2px solid var(--sage-dark); outline-offset: 2px; }

  /* ── List ── */
  .itemList {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 320px;
    overflow-y: auto;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: none; }

  .checkboxLabel {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }

  .checkbox {
    width: 18px;
    height: 18px;
    accent-color: var(--sage);
    flex-shrink: 0;
    cursor: pointer;
  }

  .itemName {
    font-size: 14px;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Add this class from JS when an item's checkbox is checked */
  .itemName.done {
    color: var(--muted);
    text-decoration: line-through;
  }

  .qtyBadge {
    font-size: 11px;
    color: var(--sage-dark);
    background: #F0F4EF;
    border-radius: 999px;
    padding: 2px 8px;
    flex-shrink: 0;
  }

  .removeBtn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 6px;
    flex-shrink: 0;
  }
  .removeBtn:hover { color: var(--bloom); }

  /* Empty state — hidden by default; show it (add .is-visible) when
     the item array is empty, and hide the <ul> at the same time */
  .emptyState {
    display: none;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding: 20px 0;
  }
  .emptyState.is-visible { display: block; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
  }
</style>
</head>
<body>

  <div class="card">

    <span class="eyebrow">Shopping · familyHub</span>
    <h2 class="title">Family list</h2>

    <div class="summaryRow">
      <span><strong id="doneCount">3</strong> of <span id="totalCount">8</span> done</span>
      <button class="clearBtn" id="clearCompletedBtn">clear done</button>
    </div>

    <div class="track">
      <div class="trackFill" id="listProgress" style="width: 37%;"></div>
    </div>

    <div class="addRow">
      <input
        type="text"
        id="newItemInput"
        placeholder="Add an item"
        aria-label="New shopping list item"
      >
      <button class="addBtn" id="addItemBtn">Add</button>
    </div>

    <!-- Empty state: toggle .is-visible on this and hide the <ul> when the list is empty -->
    <p class="emptyState" id="listEmpty">Nothing on the list yet — add the first item above.</p>

    <!-- List items: build these from JS/an array. A few sample items
         left as a markup reference — remove or clear before rendering
         your own data. -->
    <ul class="itemList" id="itemList">
      <li class="item" data-id="1">
        <label class="checkboxLabel">
          <input type="checkbox" class="checkbox" checked>
          <span class="itemName done">Milk</span>
        </label>
        <button class="removeBtn" aria-label="Remove Milk">×</button>
      </li>
      <li class="item" data-id="2">
        <label class="checkboxLabel">
          <input type="checkbox" class="checkbox" checked>
          <span class="itemName done">Eggs</span>
        </label>
        <button class="removeBtn" aria-label="Remove Eggs">×</button>
      </li>
      <li class="item" data-id="3">
        <label class="checkboxLabel">
          <input type="checkbox" class="checkbox">
          <span class="itemName">Oat flour</span>
          <span class="qtyBadge">2x</span>
        </label>
        <button class="removeBtn" aria-label="Remove Oat flour">×</button>
      </li>
      <li class="item" data-id="4">
        <label class="checkboxLabel">
          <input type="checkbox" class="checkbox">
          <span class="itemName">Apples</span>
        </label>
        <button class="removeBtn" aria-label="Remove Apples">×</button>
      </li>
    </ul>

    <div aria-live="polite" class="sr-only" id="listAnnouncer">
      3 of 8 items done.
    </div>

  </div>

</body>
</html>
