<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Card — familyHub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }

  :root {
    --bg: #FAF7F1;
    --card: #FFFFFF;
    --line: #E7E1D6;
    --ink: #2B2A25;
    --muted: #8A8577;
    --sage: #6B8F71;
    --sage-dark: #4F6F52;
    --clay: #B97452;
    --gold: #E3A23D;
    --bloom: #E1735E;
  }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 1px 2px rgba(43,42,37,0.04);
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .location {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    margin: 2px 0 20px;
  }

  /* ── Current conditions ── */
  .current {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }

  .conditionIcon { flex-shrink: 0; }

  .tempBlock { min-width: 0; }

  .temp {
    font-family: 'Fraunces', serif;
    font-size: 44px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1;
  }

  .condition {
    font-size: 14px;
    color: var(--muted);
    margin-top: 6px;
  }

  .subRow {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: var(--muted);
    padding: 12px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .subRow strong { color: var(--ink); font-weight: 600; }

  /* ── Hourly forecast strip ── */
  .forecastTitle {
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .forecastRow {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .forecastItem {
    flex: 1;
    min-width: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 6px;
    border-radius: 12px;
    background: #FCFBF8;
    border: 1px solid var(--line);
  }

  /* Reserve a class for marking the current hour from JS,
     e.g. add "isNow" to the forecastItem for the current slot */
  .forecastItem.isNow {
    background: #F3F6F2;
    border-color: var(--sage);
  }

  .forecastTime {
    font-size: 11px;
    color: var(--muted);
  }

  .forecastTemp {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
  }
</style>
</head>
<body>

  <div class="card">

    <span class="eyebrow">Weather · familyHub</span>
    <h2 class="location" id="locationName">Tallinn</h2>

    <!-- ── Current conditions ──
         Swap the SVG icon from JS based on the condition code you get
         back (sunny / cloudy / rain / snow — keep a small set of icons
         and pick one, don't try to cover every possible condition). -->
    <div class="current">
      <svg class="conditionIcon" id="conditionIcon" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="26" cy="26" r="14" fill="var(--gold)" />
        <path d="M40 34c7 0 12 5 12 11 0 1-.1 1.9-.3 2.8H16c-4.4 0-8-3.4-8-7.6 0-3.9 3-7.1 6.9-7.5C16.4 33.2 20.8 30 26 30c6.6 0 12 4.8 12 4.8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
      </svg>
      <div class="tempBlock">
        <div class="temp" id="currentTemp">18°</div>
        <div class="condition" id="conditionText">Partly cloudy</div>
      </div>
    </div>

    <div class="subRow">
      <span>H: <strong id="highTemp">21°</strong></span>
      <span>L: <strong id="lowTemp">12°</strong></span>
      <span>Feels like <strong id="feelsLike">17°</strong></span>
    </div>

    <!-- ── Hourly strip ──
         Build the .forecastItem elements from JS/an array of hours.
         One sample item left as a markup reference. -->
    <div class="forecastTitle">Today</div>
    <div class="forecastRow" id="forecastRow">
      <div class="forecastItem isNow" data-hour="now">
        <span class="forecastTime">Now</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="5" fill="var(--gold)" />
        </svg>
        <span class="forecastTemp">18°</span>
      </div>
      <div class="forecastItem" data-hour="14">
        <span class="forecastTime">14:00</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="5" fill="var(--gold)" />
        </svg>
        <span class="forecastTemp">19°</span>
      </div>
      <div class="forecastItem" data-hour="16">
        <span class="forecastTime">16:00</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M13 8c2.2 0 4 1.6 4 3.6 0 .3 0 .6-.1.9H4.4C2.5 12.5 1 11 1 9.3c0-1.6 1.3-2.9 2.9-3C4.3 5 6.4 3.3 9 3.3c2.9 0 5.2 2 5.2 2" fill="var(--muted)"/>
        </svg>
        <span class="forecastTemp">17°</span>
      </div>
      <div class="forecastItem" data-hour="18">
        <span class="forecastTime">18:00</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M13 8c2.2 0 4 1.6 4 3.6 0 .3 0 .6-.1.9H4.4C2.5 12.5 1 11 1 9.3c0-1.6 1.3-2.9 2.9-3C4.3 5 6.4 3.3 9 3.3c2.9 0 5.2 2 5.2 2" fill="var(--muted)"/>
        </svg>
        <span class="forecastTemp">15°</span>
      </div>
      <div class="forecastItem" data-hour="20">
        <span class="forecastTime">20:00</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M13 8c2.2 0 4 1.6 4 3.6 0 .3 0 .6-.1.9H4.4C2.5 12.5 1 11 1 9.3c0-1.6 1.3-2.9 2.9-3C4.3 5 6.4 3.3 9 3.3c2.9 0 5.2 2 5.2 2" fill="var(--muted)"/>
        </svg>
        <span class="forecastTemp">13°</span>
      </div>
    </div>

    <div aria-live="polite" class="sr-only" id="weatherAnnouncer">
      Current weather in Tallinn: 18 degrees, partly cloudy.
    </div>

  </div>

</body>
</html>
