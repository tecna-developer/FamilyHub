<svg xmlns="http://www.w3.org/2000/svg">
<symbol id='flower-icon' width="140" height="200" viewBox="0 0 200 200" aria-hidden="true">
        <ellipse cx="100" cy="182" rx="34" ry="8" fill="#EDE8DB" />
        <path d="M72 150 L128 150 L120 182 L80 182 Z" fill="var(--clay)" />
        <rect x="72" y="144" width="56" height="10" rx="3" fill="var(--clay)" />

        <line
          id="fhStem"
          class="fh-stem"
          x1="100" y1="178" x2="100" y2="126"
          stroke="var(--sage-dark)" stroke-width="4" stroke-linecap="round"
        />

        <ellipse
          id="fhLeaf1"
          class="fh-leaf is-visible"
          cx="82" cy="166" rx="16" ry="8"
          fill="var(--sage)"
          transform="rotate(-25 82 166)"
        />
        <ellipse
          id="fhLeaf2"
          class="fh-leaf"
          cx="118" cy="191" rx="16" ry="8"
          fill="var(--sage)"
          transform="rotate(25 118 191)"
        />
        <ellipse
          id="fhLeaf3"
          class="fh-leaf"
          cx="86" cy="138" rx="14" ry="7"
